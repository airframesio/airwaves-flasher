# Cargo workspace root.
#
# Members:
#   src-tauri              — the unprivileged Tauri GUI app
#   crates/awflash-core    — shared image-flashing logic (catalog, enumerate,
#                            decompress, write, verify, FAT customize, escalation)
#   crates/awflash-helper  — the small ELEVATED CLI that performs the device write
[workspace]
resolver = "2"
members = ["src-tauri", "crates/awflash-core", "crates/awflash-helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Airframes <hello@airframes.io>"]
repository = "https://github.com/airframesio/airwaves-os-flasher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

# release profile: the write+verify path is hashing-bound; never ship it size-optimized
[profile.release]
opt-level = 3
lto = "thin"
